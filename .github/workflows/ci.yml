name: CI

# CPU-only unit tests for the parser. tests/conftest.py puts the package's
# parent directory on sys.path itself, so a checkout named `URDFParser` with
# its parent as the working directory satisfies the `import URDFParser`
# absolute imports. The sibling `RBDReference` package (not on PyPI) plus the
# `pin` (Pinocchio) wheel are needed by the dynamics-facing tests
# (test_planar_translation_decomposition validates the parse-time
# decomposition against Pinocchio's native planar/translation joints), so
# both are provided rather than skipped — mirroring how RBDReference's own CI
# checks out URDFParser next to itself.

on:
  push:
    branches: [main, modernizing-tests]
  pull_request:
    branches: [main, modernizing-tests]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: URDFParser

      - uses: actions/checkout@v4
        with:
          repository: A2R-Lab/RBDReference
          # RBDReference's live branch is main; pin it explicitly so a future
          # default-branch change can't silently swap the sibling out.
          ref: main
          path: RBDReference

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # requirements-dev carries the LOAD-BEARING pinocchio pins (pin<4 +
        # cmeel-eigen + cmeel-urdfdom<5 — see the file's comments); an unpinned
        # `pip install pin` resolves pin 4.x, `import pinocchio` breaks, and
        # the importorskip-guarded Pinocchio tests silently skip (false green).
        run: |
          pip install -r URDFParser/requirements-dev.txt
          pip install -r RBDReference/requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest URDFParser/tests -q
